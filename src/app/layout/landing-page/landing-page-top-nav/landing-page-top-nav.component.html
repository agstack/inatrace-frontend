<div class="d-lg-none">
  <header id="main-header">
    <nav class="navbar navbar-light bg-white">
      <a class="navbar-brand white" [routerLink]="['/']">
        <img src="/assets/landing-page/landing-inatrace-logo.png" alt="Logo image">
      </a>
      <button type="button" class="navbar-toggler" (click)="toggleNavButtons()">
        <span class="navbar-toggler-icon"></span>
      </button>
      @if (showNavButtons$.value) {
        <div class="navbar-collapse" id="headercontet">
          <ul class="navbar-nav me-auto">
            @if (userProfile) {
              <li class="nav-item font-italic">
                <app-user-box></app-user-box>
              </li>
            }
            @if (!userProfile) {
              <li class="nav-item font-italic">
                <a class="nav-link" [routerLink]="['/','login']">Login</a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </header>
</div>
<div class="d-none d-lg-block">
  <header id="main-header-overlay">
    <div class="mainbar-wrap">
      <nav class="navbar navbar-light">
        <a class="navbar-brand white" [routerLink]="['/']">
          <img src="/assets/landing-page/landing-inatrace-logo.png" alt="Logo image">
        </a>
        <form class="form-inline">
          @if (userProfile) {
            <app-user-box></app-user-box>
          }
          @if (!userProfile) {
            <a class="btn btn-lg" [routerLink]="['/','login']">Login</a>
          }
        </form>
      </nav>
    </div>
  </header>
</div>
