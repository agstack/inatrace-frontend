<app-product-label-front-top-nav></app-product-label-front-top-nav>
@if (isBreadcrumbsSpaceNeeded) {
  <div [class.breadcrumbs-space]="isBreadcrumbsSpaceNeeded">
    <div class="container container-drobtinice">
      @if (drobtinice) {
        <ul class="drobtinice">
          @for (drobtinica of drobtinice; track drobtinica; let isFirst = $first) {
            <li>@if (!isFirst) {
              <span class="drobtinice-separator">/</span>
            }
            @if (drobtinica.route) {
              <a [routerLink]="drobtinica.route">{{drobtinica.title}}</a>
            }
            @if (!drobtinica.route) {
              {{drobtinica.title}}
            }
          </li>
        }
      </ul>
    }
  </div>
</div>
}
<div [class.green-padding]="isGreenPaddingNeeded"></div>
<div class="wrapper">
  <app-page-content></app-page-content>
</div>
<app-landing-page-footer></app-landing-page-footer>
