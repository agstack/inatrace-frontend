<div class="af-row">
  <div class="af-c12">
    @if (updateMode) {
      <button (click)="uploadGeoData.emit()" class="btn me-2" i18n="@@collectorDetail.plots.button.uploadGeo">
            <span>Upload geo-data</span>
        </button>
    }
    <button class="btn me-2" (click)="drawPlot()" i18n="@@collectorDetail.plots.button.drawPlot">
            <span>Draw plot</span>
        </button>
    @if (updateMode) {
      <button (click)="exportGeoData.emit()" class="btn" i18n="@@collectorDetail.plots.button.exportGeo">
            <span>Export geo-data</span>
        </button>
    }
  </div>
</div>

<div class="af-row">
  <app-map
    style="width: 100%"
    [mapId]="'map-viewer'"
    [plots]="plots"
    [plotCoordinates]="plotCoordinates"
    (plotCoordinatesChange)="updateLonLat($event)"
    (plotGeoIdChange)="updateFormGeoId($event)"
    (geoIdOpenChange)="openGeoIdWhisp($event)"
    [pin]="pin"
    [farmerId]="form.get('id')?.value"
    [initialLat]="initialLat"
    [initialLng]="initialLng"
    [plotCoordinatesManager]="plotCoordinatesManager">
  </app-map>
</div>

@if (form.get('plots')) {
  <div>
    @if (plotsListManager) {
      <list-editor
        [listEditorManager]="plotsListManager"
        [canAdd]="true"
        [addExternalSubj]="drawPlotSubject"
        label=""
        addText=""
        [invalid]="submitted && form.get('plots')?.invalid">
        <list-editor-items>
          @for (item of form.get('plots').controls; track item; let i = $index) {
            <div>
              @if (form) {
                <app-plots-item
                  [title]="item.value.plotName"
                  [formControlInput]="item"
                  [isOpen]="plotsListManager.isOpen(i)"
                  [productTypesCodebook]="productTypesCodebook"
                  [listEditorManager]="this.plotsListManager"
                  [listEditorManagerPosition]="i"
                  [initialLat]="initialLat"
                  [initialLng]="initialLng"
                  (onSave)="savePlot.emit()"
                  (onDelete)="deletePlot.emit()">
                </app-plots-item>
              }
            </div>
          }
        </list-editor-items>
        <list-editor-errors>
          @if (submitted) {
            @if (form.get('plots').errors; as errors) {
              <div class="sc-invalid-feedback">
                @if (errors.required) {
                  <div i18n="@@collectorDetail.list-editor.plots.error">
                    <span>
                        Plot is required
                    </span>
                </div>
                }
              </div>
            }
          }
        </list-editor-errors>
      </list-editor>
    }
  </div>
}
