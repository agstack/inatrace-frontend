<div class="modal-container">
  <div class="modal-header">
    <h4 class="modal-title sp-faq-modal-title">{{title}}</h4>
    @if (dismissable) {
      <button type="button" class="btn-close" aria-label="Close"
        (click)="activeModal.dismiss('Cross click')">
      </button>
    }
  </div>
  <div class="modal-body">
    @if (instructionsHtml) {
      <div [innerHTML]="instructionsHtml"></div>
    }
    <single-choice
      [label]="null"
      [formControlInput]="companyForm"
      [codebookService]="sifrantCompany">
    </single-choice>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outlined" (click)="cancel()" i18n="@@companySelect.modal.button.cancel">
        <span>Cancel</span>
    </button>
    <button type="button" class="btn" [class.disabled]="!companyForm.value" (click)="onConfirm()" i18n="@@companySelect.modal.button.confirm">
        <span>Confirm</span>
    </button>
  </div>
</div>
