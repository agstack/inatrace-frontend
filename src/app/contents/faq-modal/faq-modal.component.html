<div class="modal-container">
  <div class="modal-header">
    <h4 class="modal-title sp-faq-modal-title">Pogosta vprašanja</h4>
    @if (dismissable) {
      <button type="button" class="btn-close" aria-label="Close"
        (click)="activeModal.dismiss('Cross click')">
      </button>
    }
  </div>
  <div>
    <app-accordion>
      @for (faq of faqs; track faq; let i = $index) {
        <app-accordion-panel
          [htmlTitle]="faq?.question"
          [showArrow]="true"
          [panelId]="i"
          [masterMode]="true">
          <div [innerHTML]="faq.answer" class="sp-inner-html sp-faq-answer" routeTransformer="normal"></div>
        </app-accordion-panel>
      }
    </app-accordion>
  </div>
  <div class="modal-footer">
  </div>
</div>
