<section class="section-wrapper col">
  <div
    #parent
    class="row"
    style="position: relative;">
    @if (spacingNedded) {
      <div class="col-sm-0 col-lg-1"></div>
    }
    <div class="d-flex d-flex-column">
      <h5
        #sideTitle
        class="col-11 ps-lg-0 content-title"
        [class.active-title]="isActive"
        [style.margin-top]="marginTop"
        [class.sc-invalid-section-text]="error$ | async">{{title || data?.title}}
      </h5>

      @if (titleIcon) {
        <div (click)="onIconClick()">
          <span class="dot">
            <fa-icon
              class="title-icon"
              icon={{titleIcon}}
              size="xs">
            </fa-icon>
          </span>
        </div>
      }

    </div>
    @if (data) {
      <div class="content-comment" [innerHTML]="data.comment" routeTransformer></div>
    }
  </div>
  <div class="content-section"
    [class.active-content]="isActive"
    [class.sc-invalid-section-border]="error$ | async">
    <ng-content></ng-content>
  </div>
</section>
