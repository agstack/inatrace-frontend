<div class="cookie-container">
  @if (!hasDefinedConsentToAllCookies()) {
    <div class="sp-cookie-box">
      <app-cookie-banner
        (onAccept)="consentToAllCookies()"
        [cookieInfoUrl]="cookieInfoUrl">
      </app-cookie-banner>
    </div>
  }
</div>

<router-outlet></router-outlet>

@if (globalEventsManager.showLoadingSpinnerEmitter | async) {
  <div class="global-overlay-backdrop spinner-fade-in full-page-center"
    >
    <div class="lds-ripple">
      <div></div>
      <div></div>
    </div>
  </div>
}
