@if (product) {
  <div class="card-elevation card-box">
    <a routerLink="/product-labels/{{ product.id }}/product">
      @if (product.photoStorageId) {
        <img
          src="/api/common/image/{{ product.photoStorageId }}/SMALL"
          default="/api/common/image/{{ product.photoStorageId }}"
          class="card-img-top" alt="Product image">
      } @else {
        <img src="/src/assets/product-label-card/product-card-placeholder.png"
          class="card-img-top" alt="Product image placeholder">
      }
      <div class="card-body">
        <div class="card-text">
          <h4>{{ product.name }}</h4>
        </div>
      </div>
    </a>
  </div>
}
